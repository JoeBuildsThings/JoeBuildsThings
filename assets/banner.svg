<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Adebiyi Joseph Ayomide, software engineer for hire</title>
  <desc id="d">Software engineer for hire building AI agents, web apps and backend systems. A diagram shows a public client calling a validated API that queries a private database.</desc>
  <rect width="1200" height="420" rx="18" fill="#0b0f14"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="64" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="3" fill="#3fb950">SOFTWARE ENGINEER FOR HIRE</text>
    <text x="60" y="190" font-size="78" font-weight="800" fill="#f0f3f6">Adebiyi Joseph</text>
    <text x="60" y="272" font-size="78" font-weight="800" fill="#f0f3f6">Ayomide</text>
    <text x="64" y="346" font-size="23" fill="#8b949e">AI agents  ·  Web apps  ·  Backend systems</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="800" y="64" width="300" height="72" rx="10" fill="#11161d" stroke="#30363d" stroke-width="2"/>
    <text x="826" y="108" font-size="22" fill="#f0f3f6">Client</text>
    <text x="1074" y="106" font-size="15" text-anchor="end" fill="#8b949e">public</text>

    <rect x="800" y="174" width="300" height="72" rx="10" fill="#11161d" stroke="#30363d" stroke-width="2"/>
    <text x="826" y="218" font-size="22" fill="#f0f3f6">API and auth</text>
    <text x="1074" y="216" font-size="15" text-anchor="end" fill="#8b949e">validated</text>

    <rect x="800" y="284" width="300" height="72" rx="10" fill="#11161d" stroke="#3fb950" stroke-width="2"/>
    <text x="826" y="328" font-size="22" fill="#f0f3f6">Database</text>
    <text x="1074" y="326" font-size="15" text-anchor="end" fill="#3fb950">private</text>

    <line x1="950" y1="136" x2="950" y2="168" stroke="#3fb950" stroke-width="2"/>
    <polygon points="943,164 957,164 950,174" fill="#3fb950"/>
    <line x1="950" y1="246" x2="950" y2="278" stroke="#3fb950" stroke-width="2"/>
    <polygon points="943,274 957,274 950,284" fill="#3fb950"/>
    <text x="968" y="160" font-size="14" fill="#8b949e">request</text>
    <text x="968" y="270" font-size="14" fill="#8b949e">query</text>

    <circle cx="950" cy="136" r="4" fill="#f0f3f6">
      <animate attributeName="cy" values="136;168;168" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="246" r="4" fill="#f0f3f6">
      <animate attributeName="cy" values="246;246;278" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
