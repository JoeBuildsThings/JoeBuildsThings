<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" role="img" aria-labelledby="t d"><title id="t">GameDeck</title><desc id="d">Rootless Android performance overlay showing live FPS, CPU, RAM and thermals, with reversible gaming profiles.</desc><rect x="1" y="1" width="558" height="278" rx="16" fill="#0b0f14" stroke="#2a323d" stroke-width="2"/><rect x="32" y="22" width="91" height="28" rx="14" fill="none" stroke="#2a323d" stroke-width="1.5"/><text x="43" y="41" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#8b949e">ANDROID</text><text x="32" y="102" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f0f3f6">GameDeck</text><text x="32" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">Rootless Android overlay for</text><text x="32" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">live FPS, CPU, RAM and thermals.</text><text x="32" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">Reversible gaming profiles.</text><text x="32" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b949e">Android  ·  Shizuku  ·  No root</text><g transform="translate(352,44)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><rect width="176" height="150" rx="10" fill="#11161d" stroke="#2a323d" stroke-width="1.5"/><text x="14" y="26" font-size="12" fill="#8b949e">FPS</text><polyline points="14,76 34,56 54,66 74,44 94,62 114,48 134,64 154,50" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="14" y1="96" x2="162" y2="96" stroke="#2a323d" stroke-width="1.5"/><text x="14" y="122" font-size="11" fill="#8b949e">CPU</text><rect x="46" y="114" width="116" height="9" rx="4" fill="#1a212b"/><rect x="46" y="114" width="62" height="9" rx="4" fill="#3fb950"/><text x="14" y="142" font-size="11" fill="#8b949e">RAM</text><rect x="46" y="134" width="116" height="9" rx="4" fill="#1a212b"/><rect x="46" y="134" width="84" height="9" rx="4" fill="#3fb950"/></g></svg>