<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" role="img" aria-labelledby="t d"><title id="t">JOEBOT</title><desc id="d">Terminal AI agent with real tool calling that asks for approval before it changes anything.</desc><rect x="1" y="1" width="558" height="278" rx="16" fill="#0b0f14" stroke="#2a323d" stroke-width="2"/><rect x="32" y="22" width="159" height="28" rx="14" fill="none" stroke="#2a323d" stroke-width="1.5"/><text x="43" y="41" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#8b949e">IN DEVELOPMENT</text><text x="32" y="102" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f0f3f6">JOEBOT</text><text x="32" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">Terminal AI agent with real</text><text x="32" y="166" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">tool calling. It asks approval</text><text x="32" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">before it changes anything.</text><text x="32" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8b949e">Node.js  ·  CLI  ·  Tool calling</text><g transform="translate(352,44)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><rect width="176" height="150" rx="10" fill="#11161d" stroke="#2a323d" stroke-width="1.5"/><text x="14" y="34" font-size="13" fill="#f0f3f6">&gt; read src/app</text><text x="14" y="60" font-size="13" fill="#f0f3f6">&gt; run tests</text><text x="14" y="98" font-size="13" fill="#3fb950">approve write?</text><text x="14" y="124" font-size="13" fill="#8b949e">[y] [n]</text><rect x="74" y="112" width="8" height="15" fill="#3fb950"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect></g></svg>